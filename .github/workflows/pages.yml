# Publica MiBalance en GitHub Pages con cada cambio en main.
# Requiere: repositorio público (plan gratuito) y Settings → Pages → Source: GitHub Actions.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Compilar para la subcarpeta del repositorio
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # ID de cliente OAuth web de Google: es público, no un secreto.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 1004332909535-hq4iv43e3s8r3jc6ipcv3a77onkrocp2.apps.googleusercontent.com
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
